<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson · M03</title>
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/vendor/marked.min.js"></script>
</head>
<body>
<main>
  <article class="notebook" id="notes"><p>Loading the notes…</p></article>
  <section class="panel" id="exercises">
    <div class="row"><h2 style="margin:0">Exercises</h2><span class="spacer"></span>
      <span class="chips" role="group" aria-label="Mode">
        <button class="chip" data-mode="practice" aria-pressed="true">Check each answer</button>
        <button class="chip" data-mode="test" aria-pressed="false">Answer all, then check</button></span></div>
    <p class="mute small" id="exmeta"></p>
    <div id="quiz"></div>
  </section>
  <p id="deeplink"></p>
  <nav class="row" id="pager"></nav>
</main>
<script src="data/lessons.js"></script>
<script src="data/bank.js"></script>
<script src="assets/core.js"></script>
<script>
// One lesson: the notebook page (lessons/Lxx.md) and the exercises of that lesson.
class LessonPage {
  constructor() {
    this.id = new URLSearchParams(location.search).get('id') || (location.hash.match(/^#(L\d\d)$/) || [])[1] || 'L01';
    this.lesson = Site.lesson(this.id);
    this.bank = new Bank(window.M3_BANK);
  }
  async loadNotes() {
    const l = this.lesson;
    if (!l) { $('notes').innerHTML = '<h1>Lesson not found</h1><p>Go back to the <a href="lessons.html">lesson log</a>.</p>'; return; }
    if (l.status !== 'published') { $('notes').innerHTML = `<h1>${esc(l.title.en)}</h1><p>This lesson opens after class on ${esc(Site.fmtDate(l.date))}.</p>`; return; }
    try {
      const r = await fetch(l.notes, {cache: 'no-cache'});
      if (!r.ok) throw new Error(r.status);
      $('notes').innerHTML = Site.md(await r.text());
    } catch (e) {
      $('notes').innerHTML = `<h1>${esc(l.title.en)}</h1><p>The notes file ${esc(l.notes)} could not be loaded. Open the site through a web server (GitHub Pages or <code>python -m http.server</code>), not as a local file.</p>`;
    }
  }
  startQuiz(mode) {
    const qs = this.lesson && this.lesson.status === 'published' ? this.bank.pick({lessons: [this.id]}) : [];
    $('exmeta').textContent = qs.length ? `${qs.length} questions from this lesson. Wrong answers come with a hint about the mistake.` : '';
    this.quiz = new Quiz($('quiz'), qs, {mode, key: 'lesson-' + this.id, bank: this.bank});
    this.quiz.render();
  }
  pager() {
    const all = Site.lessons(), i = all.indexOf(this.lesson);
    const link = (l, t) => l ? `<a class="btn alt" href="lesson.html?id=${l.id}">${t}: ${esc(l.title.en)}</a>` : '';
    $('pager').innerHTML = link(all[i - 1], 'Previous') + '<span class="spacer"></span>' + link(all[i + 1], 'Next');
  }
  init() {
    const l = this.lesson;
    Site.header(l ? `${esc(Site.unitName(l.unit))}${l.unit && l.unit !== 'R' ? ' · ' : ''}Lesson ${l.n}, ${esc(Site.fmtDate(l.date))}` : 'Lesson');
    if (l) document.title = `L${l.n} ${l.title.en} · M03`;
    this.loadNotes(); this.startQuiz('practice'); if (l) this.pager();
    if (l && l.deep && l.status === 'published')
      $('deeplink').innerHTML = `<a class="btn alt" href="deep.html?id=${l.id}">Going deeper: the physics behind this lesson</a>`;
    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
      this.startQuiz(b.dataset.mode);
    }));
  }
}
new LessonPage().init();
</script>
</body>
</html>
