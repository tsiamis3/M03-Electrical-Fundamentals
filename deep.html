<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going deeper · M03</title>
<link rel="stylesheet" href="assets/lab.css?v=0a7dfa27">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css?v=d0d6077d">
<script src="assets/vendor/katex/katex.min.js?v=f4e1ebdc"></script>
<script src="assets/vendor/marked.min.js?v=b7319d77"></script>
</head>
<body>
<main>
  <article class="notebook" id="deep"><p>Loading…</p></article>
  <nav class="row" id="back"></nav>
</main>
<script src="data/lessons.js?v=40877681"></script>
<script src="assets/core.js?v=77472d13"></script>
<script>
// "Going deeper" page: deep/Lxx.md, the physics behind a lesson, for the curious. Maths in $…$ / $$…$$ is drawn with KaTeX.
class DeepPage {
  constructor() {
    this.id = new URLSearchParams(location.search).get('id') || 'L01';
    this.lesson = Site.lesson(this.id);
  }
  // Take the maths out before Markdown (which would eat the backslashes), then put it back rendered.
  render(src) {
    const math = [];
    const keep = (tex, display) => { math.push({tex, display}); return `@@MATH${math.length - 1}@@`; };
    src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true)).replace(/\$([^$\n]+?)\$/g, (_, t) => keep(t, false));
    let html = Site.md(src);
    return html.replace(/@@MATH(\d+)@@/g, (_, i) => {
      const m = math[+i];
      try { return window.katex ? katex.renderToString(m.tex, {displayMode: m.display, throwOnError: false}) : esc(m.tex); }
      catch (e) { return esc(m.tex); }
    });
  }
  async init() {
    const l = this.lesson;
    Site.header(l ? `Going deeper · Lesson ${l.n}: ${esc(l.title.en)}` : 'Going deeper');
    if (!l || !l.deep || l.status !== 'published') { $('deep').innerHTML = '<h1>Not available yet</h1><p>This page opens together with its lesson.</p>'; return; }
    document.title = `L${l.n} going deeper · M03`;
    $('back').innerHTML = `<a class="btn alt" href="lesson.html?id=${l.id}">Back to lesson ${l.n}</a>`;
    try {
      const r = await fetch(l.deep, {cache: 'no-cache'});
      if (!r.ok) throw new Error(r.status);
      $('deep').innerHTML = this.render(await r.text());
    } catch (e) {
      $('deep').innerHTML = `<p>The file ${esc(l.deep)} could not be loaded. Open the site through a web server, not as a local file.</p>`;
    }
  }
}
new DeepPage().init();
</script>
</body>
</html>
